<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tic-Tac-Toe bareng Dia</title>
<style>
:root{--bg:#fff6e8;--card:#fffdf8;--ink:#2a2233;--hair:#b8701f;--hair2:#a8283f;--rib:#2e3a66;--line:#f0d3a6;--soft:#ffe9c9;--gold:#f2c230;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14172b;--card:#1e2340;--ink:#f3efe6;--line:#3a4270;--soft:#2a3158;--rib:#dfe5ff;--hair:#e2a04a;--hair2:#ff7a8f}}
:root[data-theme="dark"]{--bg:#14172b;--card:#1e2340;--ink:#f3efe6;--line:#3a4270;--soft:#2a3158;--rib:#dfe5ff;--hair:#e2a04a;--hair2:#ff7a8f}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
h1{margin:4px 0 0;text-align:center;font-size:26px;color:var(--hair2);letter-spacing:.5px}
h1 small{display:block;font-size:13px;color:var(--ink);opacity:.7;font-weight:normal}
.stage{position:relative;display:flex;align-items:center;gap:12px}
.pic{position:relative;flex:0 0 132px;height:132px;border-radius:50%;overflow:hidden;background:#fff;border:4px solid var(--hair);box-shadow:0 4px 0 var(--rib)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .15s}
.pic img.on{opacity:1}
.pic.pop{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.12) rotate(-4deg)}60%{transform:scale(.97)}}
.sp{position:absolute;color:var(--gold);font-size:22px;opacity:0;pointer-events:none}
.stage.happy .sp{animation:tw 1s}
.sp:nth-of-type(1){left:116px;top:-4px}.sp:nth-of-type(2){left:-4px;top:4px;animation-delay:.1s}
@keyframes tw{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1) rotate(40deg)}}
.bubble{flex:1;background:var(--card);border:3px solid var(--hair);border-radius:16px;padding:10px 12px;font-size:15px;line-height:1.35;min-height:52px;position:relative;display:flex;align-items:center}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--hair);border-left:0}
.dots span{display:inline-block;animation:bl 1s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.2;transform:translateY(-3px)}}
.levels{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.levels button{border:2px solid var(--hair);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.levels button.sel{background:var(--hair);color:#fff}
.desc{text-align:center;font-size:13px;opacity:.75;margin-top:-6px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--hair);padding:8px;border-radius:18px;box-shadow:0 5px 0 var(--rib)}
.cell{aspect-ratio:1;border:0;border-radius:12px;background:var(--card);color:var(--rib);font:bold clamp(40px,14vw,64px) "Trebuchet MS",sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.cell:hover:not(:disabled){background:var(--soft)}
.cell.O{color:var(--hair2)}
.cell.w{background:var(--gold);color:#2a2233;animation:pop .6s}
.cell:disabled{cursor:default}
.score{display:flex;justify-content:space-around;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px;font-size:14px;text-align:center}
.score b{display:block;font-size:20px;color:var(--hair)}
.again{border:0;background:var(--rib);color:var(--bg);border-radius:12px;padding:12px;font:bold 16px "Trebuchet MS",sans-serif;cursor:pointer}
:root:not([data-theme="light"]) .again{color:#14172b}
</style></head><body>

function say(k,dots){$("say").innerHTML=rnd(T[k])+(dots?' <span class="dots"><span>.</span><span>.</span><span>.</span></span>':"");}
function happy(){const s=$("stage");s.classList.remove("happy");void s.offsetWidth;s.classList.add("happy");const p=$("pic");p.classList.remove("pop");void p.offsetWidth;p.classList.add("pop");}
function winner(b){for(const l of WL)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])return l;return null}
const free=b=>b.map((v,i)=>v?-1:i).filter(i=>i>=0);
function mm(b,t,d){const w=winner(b);if(w)return b[w[0]]==="O"?10-d:d-10;const f=free(b);if(!f.length)return 0;
 let best=t==="O"?-99:99;for(const i of f){b[i]=t;const s=mm(b,t==="O"?"X":"O",d+1);b[i]=null;best=t==="O"?Math.max(best,s):Math.min(best,s);}return best}
function perfect(b){let bs=-99,m=[];for(const i of free(b)){b[i]="O";const s=mm(b,"X",1);b[i]=null;if(s>bs){bs=s;m=[i]}else if(s===bs)m.push(i)}return rnd(m)}
function finish(b,p){for(const i of free(b)){b[i]=p;const w=winner(b);b[i]=null;if(w)return i}return -1}
function basic(b,center){let m=finish(b,"O");if(m<0)m=finish(b,"X");if(m>=0)return m;if(center&&!b[4])return 4;return rnd(free(b))}
function choose(){const L=LV[lv];
 if(Math.random()<L.smart)return L.perf?perfect(B):basic(B,lv>=2);
 return rnd(free(B));}
function draw(){const bd=$("board");bd.innerHTML="";const w=winner(B);
 B.forEach((v,i)=>{const c=document.createElement("button");c.className="cell"+(v==="O"?" O":"")+(w&&w.includes(i)?" w":"");c.textContent=v||"";c.disabled=!!v||over||busy;c.setAttribute("aria-label","Kotak "+(i+1)+(v?" "+v:""));c.onclick=()=>play(i);bd.appendChild(c);});}
function score(){$("sp").textContent=sc.p;$("sd").textContent=sc.d;$("se").textContent=sc.e;}
function check(){const w=winner(B);
 if(w){over=true;if(B[w[0]]==="X"){sc.p++;look(true);say("pw");}else{sc.e++;look(true);say("ew");}happy();}
 else if(!free(B).length){over=true;sc.d++;look(false);say("dr");}
 if(over){score();busy=false;}return over;}
function play(i){if(busy||over||B[i])return;B[i]="X";draw();if(check()){draw();return;}eris();}
function eris(){busy=true;look(false);say("think",true);draw();
 const L=LV[lv],ms=L.t[0]+Math.random()*(L.t[1]-L.t[0]);
 timer=setTimeout(()=>{const m=choose();B[m]="O";look(true);happy();say("move");
  if(!check()){timer=setTimeout(()=>{look(false);say("idle");busy=false;draw();},1100);}
  draw();},ms);}
function reset(first){clearTimeout(timer);B=Array(9).fill(null);over=false;busy=false;look(false);draw();
 if(first){starter=starter==="P"?"E":"P";}
 if(starter==="E")eris();else say("idle");}
function levels(){const w=$("levels");w.innerHTML="";LV.forEach((l,i)=>{const b=document.createElement("button");b.textContent=l.n;b.className=i===lv?"sel":"";b.onclick=()=>{lv=i;levels();sc={p:0,d:0,e:0};score();starter="E";reset(true);};w.appendChild(b);});$("desc").textContent=LV[lv].d;}
$("again").onclick=()=>reset(true);
levels();score();starter="E";reset(true);
</script></body></html>
